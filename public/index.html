<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1f44" />
  <meta name="description" content="CreativHeads Ad Reports — a focused workspace for performance, reviews, and daily reporting." />
  <title>Ad Reports · CreativHeads</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230a63e0'/%3E%3Cpath d='M18 45V30h7v15m7 0V20h7v25m7 0V12h7v33' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css?v=brand1" />
  <link rel="stylesheet" href="/v3.css?v=brand1" />
  <link rel="stylesheet" href="/brand.css?v=3" />
  <style>
    .sidebar{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
    .metrics, .metrics.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:10px;margin-bottom:20px}
    .metrics.six .metric{padding:12px 11px 10px;position:relative;min-width:0}
    .metrics.six .metric-top span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .metrics.six .metric-value{font-size:20px;letter-spacing:-0.5px;margin:6px 0 4px}
    .metrics.six .metric-comparison{font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sparkline{display:none!important}
    @media(max-width:1180px){
      .metrics.six .metric-top span{font-size:10px}
      .metrics.six .metric-value{font-size:18px}
      .metrics.six .metric{padding:10px 8px 8px}
    }
    @media(max-width:820px){
      .metrics, .metrics.six{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px}
    }
    @media(max-width:540px){
      .metrics, .metrics.six{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      function boot(state) {
        window.__CH_STATE = state && state.staff ? state : null;
        var script = document.createElement("script");
        script.type = "module";
        script.src = "/app.js";
        document.body.appendChild(script);
      }
      function start(state) {
        fetch("/api/live").then(function (response) { return response.ok ? response.json() : null; }).then(function (live) {
          window.__LIVE = live && live.accounts && live.accounts.length ? live : null;
          boot(state);
        }).catch(function () { window.__LIVE = null; boot(state); });
      }
      fetch("/api/auth/me").then(function (response) {
        if (response.status === 401) { location.replace("/login"); throw new Error("signed out"); }
        return response.json();
      }).then(function (me) {
        window.__USER = me.user;
        fetch("/api/state").then(function (response) { return response.ok ? response.json() : null; }).then(start).catch(function () { start(null); });
      }).catch(function () {});
    })();
  </script>
</body>
</html>
