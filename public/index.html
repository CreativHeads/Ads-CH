<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#153e35" />
  <meta name="description" content="CreativHeads Ad Reports — a focused workspace for performance, reviews, and daily reporting." />
  <title>Ad Reports · CreativHeads</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23153e35'/%3E%3Cpath d='M18 45V30h7v15m7 0V20h7v25m7 0V12h7v33' fill='%23d9ecc3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/v3.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      function boot(state) {
        window.__CH_STATE = state && state.staff ? state : null;
        var script = document.createElement("script");
        script.type = "module";
        script.src = "/app.js";
        document.body.appendChild(script);
      }
      function start(state) {
        fetch("/api/live").then(function (response) { return response.ok ? response.json() : null; }).then(function (live) {
          window.__LIVE = live && live.accounts && live.accounts.length ? live : null;
          boot(state);
        }).catch(function () { window.__LIVE = null; boot(state); });
      }
      fetch("/api/auth/me").then(function (response) {
        if (response.status === 401) { location.replace("/login"); throw new Error("signed out"); }
        return response.json();
      }).then(function (me) {
        window.__USER = me.user;
        fetch("/api/state").then(function (response) { return response.ok ? response.json() : null; }).then(start).catch(function () { start(null); });
      }).catch(function () {});
    })();
  </script>
</body>
</html>
