<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f2444" />
  <title>Reports &amp; creatives · CreativHeads</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230a63e0'/%3E%3Cpath d='M18 45V30h7v15m7 0V20h7v25m7 0V12h7v33' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/creatives.css?v=5" />
</head>
<body>
  <header class="bar">
    <a href="/" class="back">&larr; Ad Reports</a>
    <h1>Reports &amp; creatives</h1>
    <form id="filters" class="filters">
      <label>Client <select id="account"></select></label>
      <label>From <input type="date" id="from" required /></label>
      <label>To <input type="date" id="to" required /></label>
      <div class="presets">
        <button type="button" data-preset="1">Yesterday</button>
        <button type="button" data-preset="7">Last 7 days</button>
        <button type="button" data-preset="mtd">This month</button>
      </div>
      <button type="submit" class="primary">Load</button>
      <button type="button" id="pdf" class="primary ghost">Download PDF</button>
    </form>
  </header>
  <main id="report" aria-live="polite"><p class="status">Loading…</p></main>
  <script type="module" src="/creatives.js"></script>
</body>
</html>
