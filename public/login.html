<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f2444" />
  <meta name="robots" content="noindex" />
  <title>Sign in · Pulse by CreativHeads</title>
  <link rel="icon" type="image/png" href="/assets/Pulse%20Favicon.png" />
  <link rel="apple-touch-icon" href="/assets/Pulse%20Favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('ch_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <style>
    @font-face{font-family:Hanken;src:url('/assets/hanken-regular.ttf') format('truetype');font-weight:400;font-display:swap}
    @font-face{font-family:Hanken;src:url('/assets/hanken-semibold.ttf') format('truetype');font-weight:600 900;font-display:swap}
    :root{--ink:#0f172a;--muted:#64748b;--forest:#0b1f44;--lime:#eff6ff;--line:#e2e8f0;--canvas:#f8fafc;--red:#e11d48;--brand:#0066fe}
    [data-theme="dark"]{--ink:#f8fafc;--muted:#94a3b8;--forest:#f8fafc;--lime:rgba(0,102,254,0.18);--line:rgba(255,255,255,0.09);--canvas:#090d16;--red:#fb7185;--brand:#389ffe}
    [data-theme="dark"] .card{background:#0f172a;border-color:rgba(255,255,255,0.08);box-shadow:0 12px 40px rgba(0,0,0,0.6)}
    [data-theme="dark"] input{background:#111a2e;color:#f8fafc;border-color:rgba(255,255,255,0.12)}
    [data-theme="dark"] input:focus{border-color:var(--brand);outline-color:var(--brand)}
    [data-theme="dark"] .logo{content:url('/assets/Pulse_Logo_Dark.png')}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);font:15px/1.45 'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:24px 16px;-webkit-font-smoothing:antialiased}
    .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 28px;box-shadow:0 10px 40px rgba(21,62,53,.07)}
    .logo{display:block;height:34px;margin:0 auto 22px;max-width:200px;object-fit:contain}
    h1{margin:0 0 4px;font-size:22px;font-weight:700;text-align:center;color:var(--forest);letter-spacing:-0.02em}
    p.sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:13.5px}
    label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 5px;color:var(--ink)}
    input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px;color:var(--ink)}
    input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
    button{width:100%;margin-top:22px;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer;min-height:46px;transition:opacity .15s}
    button:hover{opacity:0.92}
    button:disabled{opacity:.6;cursor:default}
    .error{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:#fbefec;color:var(--red);font-size:13.5px}
    .hint{margin-top:16px;color:var(--muted);font-size:12.5px;text-align:center}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/Pulse_Logo.png" alt="Pulse by CreativHeads" />
    <form id="login">
      <h1>Sign in</h1>
      <p class="sub">Pulse by CreativHeads · Ad Reports &amp; AI Insights</p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <div class="error" role="alert"></div>
      <p class="hint">Forgot your password? Ask a workspace admin to reset it.</p>
    </form>
    <form id="setup" hidden>
      <h1>Create the first admin</h1>
      <p class="sub">No accounts exist yet. Enter the setup code from the server log, then choose your login.</p>
      <label for="code">Setup code</label>
      <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required />
      <label for="s-name">Your name</label>
      <input id="s-name" name="name" autocomplete="name" required />
      <label for="s-username">Username</label>
      <input id="s-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      <label for="s-password">Password (at least 8 characters)</label>
      <input id="s-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      <button type="submit">Create admin and sign in</button>
      <div class="error" role="alert"></div>
    </form>
  </main>
  <script>
    (function () {
      var next = new URLSearchParams(location.search).get("next") || "/";
      if (!/^\/(?!\/)/.test(next)) next = "/"; // only same-site paths
      function go() { location.replace(next); }
      function submit(form, url) {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var button = form.querySelector("button"), error = form.querySelector(".error");
          button.disabled = true;
          error.style.display = "none";
          var body = Object.fromEntries(new FormData(form));
          fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
            .then(function (r) {
              if (r.ok) return go();
              error.textContent = r.body.error || "Could not sign in.";
              error.style.display = "block";
              button.disabled = false;
            })
            .catch(function () {
              error.textContent = "Could not reach the server. Try again.";
              error.style.display = "block";
              button.disabled = false;
            });
        });
      }
      submit(document.getElementById("login"), "/api/auth/login");
      submit(document.getElementById("setup"), "/api/auth/setup");
      fetch("/api/auth/me").then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); }).then(function (r) {
        if (r.ok) return go();
        if (r.body.setupNeeded) {
          document.getElementById("login").hidden = true;
          document.getElementById("setup").hidden = false;
        }
        document.querySelector("form:not([hidden]) input").focus();
      }).catch(function () {});
    })();
  </script>
</body>
</html>
