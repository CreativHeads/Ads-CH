<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#153e35" />
  <meta name="robots" content="noindex" />
  <title>Insights · CreativHeads</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23153e35'/%3E%3Cpath d='M18 45V30h7v15m7 0V20h7v25m7 0V12h7v33' fill='%23d9ecc3'/%3E%3C/svg%3E" />
  <style>
    @font-face{font-family:Hanken;src:url('/assets/hanken-regular.ttf') format('truetype');font-weight:400;font-display:swap}
    @font-face{font-family:Hanken;src:url('/assets/hanken-semibold.ttf') format('truetype');font-weight:600 900;font-display:swap}
    :root{--ink:#202c29;--muted:#6f7872;--forest:#153e35;--green:#214e40;--lime:#ddedcb;--line:#e3e7e1;--canvas:#f7f8f5;--paper:#fff;--teal:#1f8f7a;--red:#b25242;--amber:#9a702e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 Hanken,Arial,sans-serif}
    .bar{background:var(--forest);color:#fff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
    .bar h1{margin:0;font-size:18px;font-weight:600}
    .back{color:var(--lime);text-decoration:none;font-size:13px}
    .filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin-left:auto}
    .filters label{display:flex;flex-direction:column;font-size:11px;color:#cfe0d6;gap:2px}
    .filters select,.filters input{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:0;min-height:34px}
    .presets{display:flex;gap:4px}
    button{font:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 11px;min-height:34px}
    button.primary{background:var(--lime);color:var(--forest);border-color:var(--lime);font-weight:600}
    button.dark{background:var(--forest);color:#fff;border-color:var(--forest);font-weight:600}
    button.light{background:#fff;color:var(--forest);border-color:#cfd6cf}
    button:disabled{opacity:.55;cursor:default}
    main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
    .status{color:var(--muted);padding:40px 0;text-align:center}
    .title h2{margin:0;font-size:24px;color:var(--forest)}
    .title p{margin:4px 0 16px;color:var(--muted);font-size:13px}
    .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
    .tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
    .tile small{display:block;color:var(--muted);font-size:11px}
    .tile strong{font-size:19px;font-weight:600}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
    .card>header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
    .card h3{margin:0;font-size:16px;color:var(--forest)}
    .card header small{color:var(--muted);font-size:12px}
    .card header .grow{margin-left:auto;display:flex;gap:6px}
    .ai{border-color:#cfe0c4;background:linear-gradient(180deg,#f6faf2,#fff)}
    .ai .text{font-size:14.5px;line-height:1.65}
    .ai .text p{margin:0 0 10px}.ai .text ul{margin:0 0 10px;padding-left:20px}.ai .text li{margin:3px 0}
    .note{color:var(--muted);font-size:12.5px}
    .notice{background:#fbf6ea;border:1px solid #efe2c2;color:#6d5320;border-radius:10px;padding:10px 12px;font-size:13px}
    .findings{display:grid;gap:8px}
    .finding{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
    .finding .dot{width:10px;height:10px;border-radius:99px;margin-top:6px}
    .high .dot{background:var(--red)}.medium .dot{background:var(--amber)}.info .dot{background:#7894a7}.good .dot{background:#5a9b5f}
    .finding strong{display:block;font-weight:600}
    .finding span{color:#45514c;font-size:13px;white-space:pre-line}
    ol.suggest{margin:0;padding-left:20px}ol.suggest li{margin:5px 0}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
    td.num,th.num{text-align:right;white-space:nowrap}
    .tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:#eef3ea;color:var(--forest);white-space:nowrap}
    .tag.warn{background:#f8ece9;color:var(--red)}
    .bars{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:110px;margin-top:6px}
    .bars div{background:#cfe3c2;border-radius:3px 3px 0 0;min-height:2px;position:relative}
    .bars div.top{background:var(--teal)}
    .hours{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;font-size:9.5px;color:var(--muted);text-align:center}
    body.embed{background:transparent}body.embed .bar{display:none}body.embed main{padding:0;max-width:none}
    body.embed .embed-tools{display:flex}
    .embed-tools{display:none;justify-content:flex-end;margin-bottom:10px}
    @media (max-width:800px){.grid2{grid-template-columns:1fr}.bar{padding:12px 16px}.filters{margin-left:0}}
  </style>
</head>
<body>
  <header class="bar">
    <a href="/" class="back">&larr; Ad Reports</a>
    <h1>Insights</h1>
    <form id="filters" class="filters">
      <label>Client <select id="account"></select></label>
      <label>From <input type="date" id="from" required /></label>
      <label>To <input type="date" id="to" required /></label>
      <div class="presets">
        <button type="button" data-preset="7">Last 7 days</button>
        <button type="button" data-preset="14">Last 14 days</button>
        <button type="button" data-preset="mtd">This month</button>
      </div>
      <button type="submit" class="primary">Analyse</button>
    </form>
  </header>
  <main id="out" aria-live="polite"><p class="status">Loading…</p></main>
  <script type="module" src="/insights.js"></script>
</body>
</html>
